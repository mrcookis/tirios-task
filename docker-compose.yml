version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: tirios-db
    environment:
      POSTGRES_USER: tirios
      POSTGRES_PASSWORD: tirios
      POSTGRES_DB: tirios
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tirios"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: tirios-app
    environment:
      DATABASE_URL: postgresql+asyncpg://tirios:tirios@db:5432/tirios
      JWT_SECRET_KEY: changeme-for-production
      APP_ENV: development
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
